networks:
 default:
    name: ${docker_network}
    external: true

services:
  # REST<=>MCP gateway
  mcp-gateway:
    image: itaru2622/mcp:trixie
    ports:
      - ${port_mcpgateway}:${port_mcpgateway}
    privileged: true
    environment:
      - FASTMCP_EXPERIMENTAL_ENABLE_NEW_OPENAPI_PARSER=true
      - wDir=${wDir}
      - sDir=${sDir}
      - myIP=${myIP}
      - GH_MCP_PAT=${GH_MCP_PAT}
      - PYTHONPATH=${pythonPATH}
      - DOCKER_DRIVER=vfs
    volumes:
      - ${wDir}:${wDir}
      - /etc/resolv.conf:/etc/resolv.conf:ro
    command: /lib/systemd/systemd
    working_dir: ${wDir}
    restart: always


  # MCP inspector
  inspector:
    image: node:24-trixie
    ports:
      - ${port_inspector}:${port_inspector}
      - ${port_inspector_proxy}:${port_inspector_proxy}
    environment:
      - DANGEROUSLY_OMIT_AUTH=true
      - CLIENT_PORT=${port_inspector}
      - SERVER_PORT=${port_inspector_proxy}
      - HOST=0.0.0.0
      - PORT=${port_inspector}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    command: npx @modelcontextprotocol/inspector@1.0.0
    # inspector v2.0.0 has trouble on use, issue 1845 (Couldn't access platform storage: PermissionDenied)
    volumes:
      - ${wDir}:${wDir}
    restart: always

# swagger editor supporting openAPI v3.1 and try-it-out
  swagger:
    image: swaggerapi/swagger-editor:${ver_swagger}
    ports:
      - ${port_swagger}:80
    environment:
      - wDir=${wDir}
      - sDir=${sDir}
#     - REACT_APP_SWAGEER_FILE=my/ghec-get.json
    volumes:
      - ${wDir}:${wDir}
    restart: always
